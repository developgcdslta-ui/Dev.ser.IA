<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vigília Zero</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071015;
    color: #e4f0e9; font-family: system-ui, sans-serif; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .toque { position: fixed; inset: auto 0 0; display: none; justify-content: space-between;
    align-items: end; padding: 7px; pointer-events: none; }
  .toque.visivel { display: flex; }
  .toque .cruz { display: grid; grid-template: repeat(3, 38px) / repeat(3, 38px); gap: 2px; }
  .toque .acoes { display: grid; grid-template: repeat(3, 38px) / repeat(3, 38px); gap: 3px; }
  .toque button { pointer-events: auto; border: 1px solid #9cc2b9aa; border-radius: 12px;
    background: #101c23c9; color: #e6f2e9; font: 700 14px system-ui; touch-action: none; }
  .toque button[data-pulsy-button="a"] { border-color: #ffc46b; color: #ffc46b; }
  .toque .vazio { visibility: hidden; }
  @media (max-height: 340px) {
    .toque .cruz { grid-template: repeat(3, 30px) / repeat(3, 30px); }
    .toque .acoes { grid-template: repeat(3, 30px) / repeat(3, 30px); gap: 2px; }
    .toque button { border-radius: 9px; font-size: 12px; }
  }
</style>
</head>
<body>
<canvas id="tela" aria-label="Vigília Zero, jogo de sobrevivência em primeira pessoa"></canvas>
<div class="toque" id="toque" data-pulsy-touch-controls>
  <div class="cruz" aria-label="Movimento">
    <span class="vazio"></span><button data-pulsy-button="up" aria-label="Avançar">▲</button><span class="vazio"></span>
    <button data-pulsy-button="left" aria-label="Mover à esquerda">◀</button><span class="vazio"></span><button data-pulsy-button="right" aria-label="Mover à direita">▶</button>
    <span class="vazio"></span><button data-pulsy-button="down" aria-label="Recuar">▼</button><span class="vazio"></span>
  </div>
  <div class="acoes" aria-label="Ações">
    <button data-pulsy-button="l" aria-label="Arma anterior">L</button><button data-pulsy-button="x" aria-label="Recarregar">X</button><button data-pulsy-button="r" aria-label="Próxima arma">R</button>
    <button data-pulsy-button="select" aria-label="Som">−</button><button data-pulsy-button="y" aria-label="Trocar arma">Y</button><button data-pulsy-button="start" aria-label="Pausar">+</button>
    <button data-pulsy-button="b" aria-label="Correr">B</button><span class="vazio"></span><button data-pulsy-button="a" aria-label="Atirar">A</button>
  </div>
</div>
<script>
(function () {
  'use strict';

  var W = 400, H = 360, STRIP = 2, COLS = W / STRIP, FOV = 1.12;
  var canvas = document.getElementById('tela'), touch = document.getElementById('toque');
  var ctx = canvas.getContext('2d', { alpha: false });
  var scale = 1, offsetX = 0, offsetY = 0, pixelRatio = 1;
  var state = 'menu', player = null, wave = 0, kills = 0, seconds = 0;
  var spawnLeft = 0, spawnTimer = 0, waveDelay = 0, bannerTimer = 0;
  var enemies = [], pickups = [], sparks = [], sprites = [], dust = [], floorMarks = [];
  var zBuffer = new Float32Array(COLS), rayHit = { distance: 0, tile: 1, side: 0, u: 0 };
  var held = Object.create(null), leftAxis = { x: 0, y: 0 }, rightAxis = { x: 0, y: 0 };
  var movementInput = { x: 0, y: 0 }, cameraState = { horizon: 0, focal: 0 };
  var ignoreAUntilRelease = false, rafId = 0, lastFrame = 0, rng = 8213907;
  var audio = null, recoil = 0, flash = 0, damageFlash = 0, message = '', messageTimer = 0;
  var activeTransmission = -1, transmissionTimer = 0;
  var pause = { option: 0, confirm: '', confirmUntil: 0, follow: false, help: false, archive: false, archiveIndex: 0 };
  var pauseOptions = ['Continuar', 'Som', 'Ajuda', 'Arquivo', 'Recomeçar', 'Menu'];
  var transmissions = [
    { wave: 1, chapter: 'CAP. 01 · SILÊNCIO', short: 'SILÊNCIO',
      lines: ['Nara: Boreal ficou muda.', 'O sinal veio do setor 09.'] },
    { wave: 3, chapter: 'CAP. 02 · ECO', short: 'ECO',
      lines: ['O alarme chama por nomes.', 'Não responda pelo intercom.'] },
    { wave: 6, chapter: 'CAP. 03 · GERADOR', short: 'GERADOR',
      lines: ['Ivo: gerador intacto.', 'Cortaram a energia por dentro.'] },
    { wave: 9, chapter: 'CAP. 04 · ASSINATURA', short: 'ASSINATURA',
      lines: ['Nara: assinei a evacuação.', 'Depois que todos já tinham saído.'] },
    { wave: 12, chapter: 'CAP. 05 · VIGÍLIA', short: 'VIGÍLIA',
      lines: ['Ivo: a escotilha norte abre.', 'Fiquei para manter o sinal.'] }
  ];
  var difficultyNames = ['CALMA', 'PADRÃO', 'INTENSA'];
  var weaponOrder = ['pistol', 'shotgun', 'smg', 'rifle'];
  var weaponNames = { pistol: 'PISTOLA', shotgun: 'ESCOPETA', smg: 'SUBMETRALHADORA', rifle: 'FUZIL' };
  var weaponSpecs = {
    pistol: { mag: 12, reserve: 72, rate: 0.31, reload: 0.92, damage: 1.12, spread: 0.008, pellets: 1, tone: 180 },
    shotgun: { mag: 6, reserve: 30, rate: 0.78, reload: 1.22, damage: 0.48, spread: 0.105, pellets: 6, tone: 92 },
    smg: { mag: 28, reserve: 112, rate: 0.105, reload: 1.08, damage: 0.43, spread: 0.025, pellets: 1, tone: 135 },
    rifle: { mag: 20, reserve: 100, rate: 0.24, reload: 1.15, damage: 1.02, spread: 0.012, pellets: 1, tone: 110 }
  };
  var weaponSleeve = [-50, -2, -35, -31, -13, -26, -2, 8, -39, 18];
  var weaponBody = [4, -35, 23, -45, 39, -33, 37, 2, 15, 12, 0, -3];
  var weaponTop = [-26, -47, 25, -52, 31, -23, 17, -12, -22, -17];
  var mapRows = [
    '1111111111111111', '1000000000000001', '1000100000010001', '1000100000010001',
    '1000000000000001', '1011001100110001', '1000000000000001', '1000000100000001',
    '1000000100000001', '1000000000000001', '1011001100110001', '1000000000000001',
    '1000100000010001', '1000100000010001', '1000000000000001', '1111111111111111'
  ];
  var MAP = mapRows.map(function (row) { return row.split(''); });
  MAP[2][4] = '2'; MAP[3][11] = '3'; MAP[5][4] = '2'; MAP[10][11] = '3'; MAP[12][11] = '2';

  var PREF_KEY = 'vigilia-zero.prefs.v1';
  var SAVE_KEY = 'vigilia-zero.partida.v1';
  function readJson(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  }
  function writeJson(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
  }
  function removeKey(key) { try { localStorage.removeItem(key); } catch (e) {} }
  function finiteNumber(value, fallback, min, max) {
    var n = Number(value);
    return Number.isFinite(n) ? Math.max(min, Math.min(max, n)) : fallback;
  }
  function loadPrefs() {
    var data = readJson(PREF_KEY);
    if (!data || data.versao !== 1) return { versao: 1, som: true, dificuldade: 1, melhorOnda: 0, melhorAbates: 0 };
    return {
      versao: 1,
      som: data.som !== false,
      dificuldade: finiteNumber(data.dificuldade, 1, 0, 2),
      melhorOnda: finiteNumber(data.melhorOnda, 0, 0, 999),
      melhorAbates: finiteNumber(data.melhorAbates, 0, 0, 999999)
    };
  }
  var prefs = loadPrefs();
  function savePrefs() { writeJson(PREF_KEY, prefs); }
  function random() {
    rng = (Math.imul(rng, 1664525) + 1013904223) >>> 0;
    return rng / 4294967296;
  }
  function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }
  function isWall(x, y) {
    var mx = Math.floor(x), my = Math.floor(y);
    return my < 0 || my >= MAP.length || mx < 0 || mx >= MAP[0].length || MAP[my][mx] !== '0';
  }
  for (var markIndex = 0; markIndex < 34; markIndex++) {
    var markX = 1.3, markY = 1.3, markAttempts = 0;
    do {
      markX = 1.3 + random() * 13.4; markY = 1.3 + random() * 13.4;
      markAttempts++;
    } while (isWall(markX, markY) && markAttempts < 18);
    if (!isWall(markX, markY)) {
      floorMarks.push({
        x: markX, y: markY, angle: random() * Math.PI,
        length: 0.08 + random() * 0.22, width: 0.012 + random() * 0.018,
        type: markIndex % 6, variation: 0.8 + random() * 0.4
      });
    }
  }
  function canStand(x, y, radius) {
    var minX = Math.floor(x - radius), maxX = Math.floor(x + radius);
    var minY = Math.floor(y - radius), maxY = Math.floor(y + radius);
    for (var yy = minY; yy <= maxY; yy++) {
      for (var xx = minX; xx <= maxX; xx++) {
        if (isWall(xx, yy)) {
          var nearX = Math.max(xx, Math.min(x, xx + 1));
          var nearY = Math.max(yy, Math.min(y, yy + 1));
          if ((x - nearX) * (x - nearX) + (y - nearY) * (y - nearY) < radius * radius) return false;
        }
      }
    }
    return true;
  }
  function moveBody(body, dx, dy, radius) {
    if (canStand(body.x + dx, body.y, radius)) body.x += dx;
    if (canStand(body.x, body.y + dy, radius)) body.y += dy;
  }
  var enemyDetourAngles = [Math.PI / 4, -Math.PI / 4, Math.PI / 2, -Math.PI / 2,
    Math.PI * 3 / 4, -Math.PI * 3 / 4];
  function enemyMoveProgress(body, dx, dy, directionX, directionY) {
    var x = body.x, y = body.y;
    if (canStand(x + dx, y, 0.2)) x += dx;
    if (canStand(x, y + dy, 0.2)) y += dy;
    if (x === body.x && y === body.y) return -Infinity;
    return (x - body.x) * directionX + (y - body.y) * directionY;
  }
  function chaseEnemy(enemy, targetX, targetY, dt) {
    var vx = targetX - enemy.x, vy = targetY - enemy.y, distance = Math.hypot(vx, vy);
    var step = enemy.speed * dt, directionX = vx / distance, directionY = vy / distance;
    var beforeX = enemy.x, beforeY = enemy.y;
    moveBody(enemy, directionX * step, directionY * step, 0.2);
    if (Math.hypot(enemy.x - beforeX, enemy.y - beforeY) > step * 0.75) {
      enemy.blockedTime = 0; enemy.detourAngle = null; return;
    }
    enemy.blockedTime = (enemy.blockedTime || 0) + dt;
    if (enemy.blockedTime < 0.12) return;

    vx = targetX - enemy.x; vy = targetY - enemy.y; distance = Math.hypot(vx, vy);
    directionX = vx / distance; directionY = vy / distance;
    if (Number.isFinite(enemy.detourAngle) &&
        enemyMoveProgress(enemy, Math.cos(enemy.detourAngle) * step, Math.sin(enemy.detourAngle) * step,
          directionX, directionY) !== -Infinity) {
      moveBody(enemy, Math.cos(enemy.detourAngle) * step, Math.sin(enemy.detourAngle) * step, 0.2);
      return;
    }
    enemy.detourAngle = null;
    var side = enemy.detourSide < 0 ? -1 : 1, bestOffset = 0, bestProgress = -Infinity, bestAngle = 0;
    for (var i = 0; i < enemyDetourAngles.length; i++) {
      var offset = enemyDetourAngles[i] * side, angle = Math.atan2(vy, vx) + offset;
      var progress = enemyMoveProgress(enemy, Math.cos(angle) * step, Math.sin(angle) * step,
        directionX, directionY);
      if (progress > bestProgress + 0.00001) {
        bestProgress = progress; bestOffset = offset; bestAngle = angle;
      }
    }
    if (bestOffset) {
      enemy.detourAngle = bestAngle; enemy.detourSide = bestOffset < 0 ? -1 : 1;
      moveBody(enemy, Math.cos(bestAngle) * step, Math.sin(bestAngle) * step, 0.2);
    } else enemy.blockedTime = 0;
  }
  function createAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
    }
    syncAudio();
  }
  function syncAudio() {
    if (!audio) return;
    var shouldRun = prefs.som && state === 'jogando' && document.visibilityState !== 'hidden';
    try { if (shouldRun) audio.resume(); else audio.suspend(); } catch (e) {}
  }
  function tone(freq, duration, shape, volume, endFreq) {
    if (!audio || !prefs.som || audio.state !== 'running') return;
    try {
      var osc = audio.createOscillator(), gain = audio.createGain(), now = audio.currentTime;
      osc.type = shape || 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(25, endFreq), now + duration);
      gain.gain.setValueAtTime(volume || 0.035, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain); gain.connect(audio.destination);
      osc.start(now); osc.stop(now + duration);
    } catch (e) {}
  }
  function sound(name) {
    if (name === 'shot') tone(weaponSpecs[player.weapon].tone, 0.09, 'sawtooth', 0.045, 48);
    else if (name === 'hit') tone(420, 0.055, 'triangle', 0.018, 180);
    else if (name === 'damage') tone(125, 0.18, 'sawtooth', 0.045, 42);
    else if (name === 'reload') tone(330, 0.08, 'square', 0.018, 230);
    else if (name === 'pickup') tone(620, 0.12, 'sine', 0.025, 940);
    else if (name === 'wave') tone(220, 0.28, 'triangle', 0.035, 520);
    else if (name === 'dry') tone(85, 0.045, 'square', 0.015, 65);
  }

  function buildTexture(kind) {
    var tile = document.createElement('canvas');
    tile.width = 64; tile.height = 64;
    var t = tile.getContext('2d');
    var base = kind === 1 ? '#293b42' : kind === 2 ? '#304848' : '#343f49';
    t.fillStyle = base; t.fillRect(0, 0, 64, 64);
    t.fillStyle = '#40565a'; t.fillRect(4, 5, 56, 2);
    t.fillStyle = '#17262d'; t.fillRect(4, 7, 56, 2);
    t.fillStyle = kind === 2 ? '#75b8a3' : kind === 3 ? '#d08d55' : '#738d8b';
    t.globalAlpha = 0.55; t.fillRect(5, 10, 2, 37); t.globalAlpha = 1;
    t.fillStyle = '#1a2b31'; t.fillRect(10, 12, 46, 34);
    t.fillStyle = '#33484b'; t.fillRect(12, 14, 42, 30);
    t.fillStyle = '#213339';
    for (var y = 17; y < 44; y += 8) t.fillRect(12, y, 42, 1);
    for (var x = 16; x < 54; x += 12) t.fillRect(x, 15, 1, 28);
    t.fillStyle = kind === 2 ? '#a5ebc8' : kind === 3 ? '#f4b66e' : '#a6d6c8';
    t.fillRect(7, 50, 50, 2); t.fillRect(7, 54, 9, 3); t.fillRect(19, 54, 4, 3);
    t.fillStyle = '#0d1a20'; t.fillRect(45, 16, 9, 22);
    t.fillStyle = '#718783';
    for (var vent = 0; vent < 5; vent++) t.fillRect(47, 18 + vent * 4, 5, 1);
    t.fillStyle = '#91a69a';
    t.beginPath(); t.arc(9, 13, 1.5, 0, Math.PI * 2); t.fill();
    t.beginPath(); t.arc(55, 47, 1.5, 0, Math.PI * 2); t.fill();
    if (kind === 2) {
      t.fillStyle = '#78b99c'; t.globalAlpha = 0.65;
      t.fillRect(23, 22, 2, 17); t.fillRect(27, 28, 1, 10); t.globalAlpha = 1;
    } else if (kind === 3) {
      t.fillStyle = '#171d1d'; t.fillRect(30, 53, 23, 5);
      t.fillStyle = '#e8a65e';
      for (var stripe = 0; stripe < 4; stripe++) {
        t.beginPath(); t.moveTo(31 + stripe * 7, 53); t.lineTo(35 + stripe * 7, 53);
        t.lineTo(32 + stripe * 7, 58); t.lineTo(28 + stripe * 7, 58); t.closePath(); t.fill();
      }
    } else {
      t.fillStyle = '#71807b'; t.fillRect(24, 52, 2, 5); t.fillRect(28, 52, 1, 5);
    }
    t.fillStyle = '#111c23'; t.fillRect(0, 0, 64, 3); t.fillRect(0, 61, 64, 3);
    t.fillStyle = '#687b78';
    for (var i = 0; i < 8; i++) {

      t.fillRect(8 + i * 7, 60, 2, 1);
    }

  }
  var wallTextures = [buildTexture(1), buildTexture(2), buildTexture(3)];
  for (var di = 0; di < 26; di++) {
    dust.push({ x: random() * W, y: random() * H, speed: 3 + random() * 8, phase: random() * 6.28, size: 0.5 + random() * 1.2 });
  }
  function resize() {
    pixelRatio = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(window.innerWidth * pixelRatio));
    canvas.height = Math.max(1, Math.round(window.innerHeight * pixelRatio));
    scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    offsetX = (window.innerWidth - W * scale) * 0.5;
    offsetY = (window.innerHeight - H * scale) * 0.5;
    draw();
  }
  window.addEventListener('resize', resize);

  function newStock(id) {
    return { mag: weaponSpecs[id].mag, reserve: weaponSpecs[id].reserve };
  }
  function startGame() {
    rng = (Date.now() ^ 8213907) >>> 0;
    player = {
      x: 8.5, y: 8.5, yaw: 0, pitch: 0, hp: 100, stamina: 100, weapon: 'pistol',
      stocks: { pistol: newStock('pistol') }, cooldown: 0, reloadTime: 0,
      reloadWeapon: '', invulnerable: 0, bob: 0, hurt: 0
    };
    wave = 1; kills = 0; seconds = 0; spawnLeft = 4; spawnTimer = 0.5;
    activeTransmission = -1; transmissionTimer = 0; discoverTransmission(wave);
    waveDelay = 0; bannerTimer = 2.8; recoil = 0; flash = 0; damageFlash = 0;
    enemies.length = 0; pickups.length = 0; sparks.length = 0; sprites.length = 0;

    pause.confirm = ''; pause.confirmUntil = 0;
    ignoreAUntilRelease = !!held.a; gameOverLock = 0;

  }
  function unlockedTransmissions() {
    var found = [];
    for (var i = 0; i < transmissions.length; i++) {
      if (wave >= transmissions[i].wave) found.push(transmissions[i]);
    }
    return found;
  }
  function discoverTransmission(waveNumber) {
    for (var i = 0; i < transmissions.length; i++) {
      if (transmissions[i].wave === waveNumber) {
        activeTransmission = i; transmissionTimer = 7;
        return;
      }
    }
  }
  function currentChapter() {
    var chapter = transmissions[0];
    for (var i = 0; i < transmissions.length; i++) {

    }

  }
  function unlockWeapons() {
    var unlockAt = { shotgun: 2, smg: 4, rifle: 6 };
    for (var i = 1; i < weaponOrder.length; i++) {
      var id = weaponOrder[i];
      if (wave >= unlockAt[id] && !player.stocks[id]) {
        player.stocks[id] = newStock(id);
        message = weaponNames[id] + ' LIBERADA'; messageTimer = 2.4;
      }
    }
  }
  function spawnEnemy() {
    var x = 1.5, y = 1.5, found = false;
    for (var attempt = 0; attempt < 55; attempt++) {
      x = 1.2 + random() * 13.6; y = 1.2 + random() * 13.6;
      if (!canStand(x, y, 0.25) || Math.hypot(x - player.x, y - player.y) < 4.4) continue;
      found = true; break;
    }
    if (!found) {
      for (var yy = 1; yy < 15 && !found; yy++) for (var xx = 1; xx < 15; xx++) {
        if (!isWall(xx + 0.5, yy + 0.5) && Math.hypot(xx + 0.5 - player.x, yy + 0.5 - player.y) > 3.7) {

    enemies.push({

      speed: (0.60 + Math.min(0.7, wave * 0.035)) * hard, attack: random() * 0.55,

    });

  }
  function spawnPickup(x, y, type) {
    if (pickups.length >= 6) return;
    pickups.push({ x: x, y: y, type: type, phase: random() * 6.28, renderDistance: 0 });
  }
  function addSparks(x, y, color, count) {
    for (var i = 0; i < count && sparks.length < 60; i++) {

  function finishGame() {

  }

        e.attack -= dt;
        if (e.attack <= 0 && player.invulnerable <= 0) {
          var damage = (8 + wave * 0.45) * [0.7, 1, 1.3][prefs.dificuldade];
          player.hp = Math.max(0, player.hp - damage); player.invulnerable = 0.76;
          player.hurt = 0.7; damageFlash = 0.7; e.attack = 0.9; sound('damage');
          if (player.hp <= 0) { finishGame(); return; }
        }
      }
    }
    for (var j = pickups.length - 1; j >= 0; j--) {
      var item = pickups[j];
      if (Math.hypot(item.x - player.x, item.y - player.y) > 0.66) continue;
      if (item.type === 'med' && player.hp < 98) {
        player.hp = Math.min(100, player.hp + 28); message = 'KIT MÉDICO  +28'; messageTimer = 1.5;
      } else if (item.type === 'ammo') {
        player.stocks[player.weapon].reserve = Math.min(999, player.stocks[player.weapon].reserve + 18);
        message = 'CÉLULAS  +18'; messageTimer = 1.5;
      } else continue;
      pickups.splice(j, 1); sound('pickup');
    }
    for (var k = sparks.length - 1; k >= 0; k--) {
      var spark = sparks[k]; spark.life -= dt;
      if (spark.life <= 0) { sparks.splice(k, 1); continue; }
      spark.x += spark.vx * dt; spark.y += spark.vy * dt;
      spark.vx *= 0.985; spark.vy *= 0.985;
    }
  }
  function startLoop() {
    if (state === 'jogando' && !rafId && document.visibilityState !== 'hidden') {
      lastFrame = performance.now(); rafId = requestAnimationFrame(frame);
    }
  }
  function stopLoop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }
  function frame(now) {
    rafId = 0;
    if (state !== 'jogando' || document.visibilityState === 'hidden') return;
    var dt = Math.min(1 / 30, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now; update(dt); draw();
    if (state === 'jogando') rafId = requestAnimationFrame(frame);
  }
  function setAxis(x, y) {
    leftAxis.x = finiteNumber(x, 0, -1, 1); leftAxis.y = finiteNumber(y, 0, -1, 1);
  }
  function setRightAxis(x, y) {
    x = finiteNumber(x, 0, -1, 1); y = finiteNumber(y, 0, -1, 1);
    var magnitude = Math.hypot(x, y);
    if (magnitude <= 0.08) { rightAxis.x = 0; rightAxis.y = 0; return; }
    var scale = (magnitude - 0.08) / magnitude;
    rightAxis.x = x * scale; rightAxis.y = y * scale;
  }

  window.PulsyGame = {
    onButton: function (name, pressed) {
      try {
        button(String(name), !!pressed);
      } catch (e) {}
    },
    onAxis: function (x, y) { setAxis(x, y); },
    onAxisRight: function (x, y) {
      setRightAxis(x, y);
    },
    onPause: function (paused) {
      if (paused && state === 'jogando') openPause(false);
      else if (!paused && state === 'pausa') { pause.follow = true; saveSessionState(); draw(); }
      if (paused) { releaseAll(); syncAudio(); }
    },
    saveSession: function () {
      var saved = saveSessionState(); savePrefs();
      return { exact: saved, summary: saveSummary() };
    },
    resumeSession: function () {
      var saved = readJson(SAVE_KEY);
      if (saved && saved.versao === 1 && saved.modo === 'jogando') {
        if (!restoreGame(saved.jogo)) { state = 'menu'; player = null; draw(); return false; }
      } else if (saved && saved.versao === 1 && saved.modo === 'fim') {
        state = 'menu'; player = null;
        wave = finiteNumber(saved.wave, 0, 0, 999); kills = finiteNumber(saved.kills, 0, 0, 999999);
        draw();
      } else {
        state = 'menu'; player = null; draw();
      }
      return true;
    },
    newSession: function () {
      removeKey(SAVE_KEY); state = 'menu'; player = null; releaseAll(); stopLoop(); syncAudio(); draw();
    },
    getWeaponControls: function () {
      var unlocked = [];
      if (player && state === 'jogando') {
        for (var i = 0; i < weaponOrder.length; i++) if (player.stocks[weaponOrder[i]]) unlocked.push(weaponOrder[i]);
      }
      return { enabled: state === 'jogando', unlocked: unlocked, current: player ? player.weapon : 'pistol' };
    },
    selectWeapon: function (id) {
      if (state !== 'jogando' || !player || !player.stocks[id] || player.reloadTime > 0) return false;
      player.weapon = id; player.cooldown = Math.max(player.cooldown, 0.12); draw(); return true;
    }
  };

  var keys = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    ' ': 'a', Enter: 'a', z: 'a', x: 'x', r: 'x', Escape: 'b', Shift: 'b',
    p: 'start', m: 'select', y: 'y', q: 'l', e: 'r'
  };
  var wasd = { w: false, a: false, s: false, d: false };
  function updateWasd() {
    setAxis((wasd.d ? 1 : 0) - (wasd.a ? 1 : 0), (wasd.s ? 1 : 0) - (wasd.w ? 1 : 0));
  }
  document.addEventListener('keydown', function (event) {
    var key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    if (key in wasd) { event.preventDefault(); wasd[key] = true; updateWasd(); createAudio(); return; }
    var name = keys[key];
    if (name) { event.preventDefault(); button(name, true); }
  });
  document.addEventListener('keyup', function (event) {
    var key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    if (key in wasd) { wasd[key] = false; updateWasd(); return; }
    var name = keys[key]; if (name) button(name, false);
  });
  function releaseKeyboard() {
    wasd.w = false; wasd.a = false; wasd.s = false; wasd.d = false;
    leftAxis.x = 0; leftAxis.y = 0; releaseAll();
  }
  window.addEventListener('blur', function () {
    releaseKeyboard();
    if (state === 'jogando') openPause(false);
  });
  touch.querySelectorAll('[data-pulsy-button]').forEach(function (el) {
    var name = el.getAttribute('data-pulsy-button');
    el.addEventListener('pointerdown', function (event) {
      event.preventDefault(); el.setPointerCapture(event.pointerId); createAudio(); button(name, true);
    });
    el.addEventListener('pointerup', function () { button(name, false); });
    el.addEventListener('pointercancel', function () { button(name, false); });
    el.addEventListener('lostpointercapture', function () { button(name, false); });
  });
  var drag = null;
  canvas.addEventListener('pointerdown', function (event) {
    if (window.__pulsyConsole) return;
    event.preventDefault(); createAudio();
    if (state === 'menu') { button('a', true); button('a', false); return; }
    if (state === 'pausa' || state === 'fim') { button('a', true); button('a', false); return; }
    canvas.setPointerCapture(event.pointerId); drag = { x: event.clientX, y: event.clientY };
    button('a', true);
  });
  canvas.addEventListener('pointermove', function (event) {
    if (!drag) return;
    if (state !== 'jogando' || !player) { endDrag(); return; }
    var dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    player.yaw += dx * 0.006; player.pitch = Math.max(-0.38, Math.min(0.38, player.pitch + dy * 0.004));
    drag.x = event.clientX; drag.y = event.clientY;
  });
  function endDrag() { if (drag) button('a', false); drag = null; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('lostpointercapture', endDrag);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && state === 'jogando') openPause(false);
    syncAudio();
  });
  window.addEventListener('pagehide', function () { saveSessionState(); savePrefs(); });

  resize();
  draw();
})();
</script>
</body>
</html>
